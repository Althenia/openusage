name: CI

on:
  # The Swift edition ships from `main`. The frozen Tauri edition is preserved on `tauri-legacy`.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build
        run: swift build

      - name: Select tests
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
          fi
          bash script/ci/select-tests.sh range "$base" "$head" > /tmp/select-tests.out
          cat /tmp/select-tests.out
          mode="$(sed -n 's/^mode=//p' /tmp/select-tests.out)"
          filter="$(sed -n 's/^filter=//p' /tmp/select-tests.out)"
          run_selector_tests="$(sed -n 's/^run_selector_tests=//p' /tmp/select-tests.out)"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'filter=%s\n' "$filter" >> "$GITHUB_OUTPUT"
          printf 'run_selector_tests=%s\n' "$run_selector_tests" >> "$GITHUB_OUTPUT"

      - name: Run selector tests
        if: steps.select.outputs.run_selector_tests == 'true'
        run: bash script/ci/select-tests.test.sh

      - name: Run focused tests
        if: steps.select.outputs.mode == 'focused'
        env:
          FILTER: ${{ steps.select.outputs.filter }}
        run: |
          set -euo pipefail
          swift test --filter "$FILTER"

      - name: Run all tests
        if: steps.select.outputs.mode == 'full'
        run: swift test
